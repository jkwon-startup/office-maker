name: Validate Office Maker
on:
  push:
  pull_request:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node common/runtime/setup.mjs --install
      - run: node common/runtime/setup.mjs --check
      - run: npm run doctor
      - run: npm test
      - run: npm run release:check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run osmu -- --input examples/synthetic/input.json --dry-run
      - run: npm run osmu -- --input examples/synthetic/input.json --output outputs/ci-demo --run-dir work/ci-demo
      - run: npm run osmu -- --input examples/synthetic/input.json --output outputs/ci-demo --run-dir work/ci-demo
